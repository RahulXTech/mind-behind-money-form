# Builds the React site and publishes the ready-to-serve files (dist/) to the "deploy" branch.
# Hostinger (hPanel → Advanced → GIT) deploys from the "deploy" branch.
name: Build and publish to deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MindBehindMonyApp/client/package-lock.json

      - run: npm ci
        working-directory: MindBehindMonyApp/client
      - run: npm run build
        working-directory: MindBehindMonyApp/client

      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./MindBehindMonyApp/client/dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
